{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Login - Owners</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .login-container { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 20px; }
        .btn-google { 
            display: inline-block; padding: 10px 20px; background-color: #DB4437; 
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; 
            font-family: sans-serif; transition: 0.3s; width: 100%; text-align: center;
        }
        .btn-google:hover { background-color: #c53929; }
        .divider { width: 100%; text-align: center; border-bottom: 1px solid #ccc; line-height: 0.1em; margin: 20px 0; }
        .divider span { background: #fff; padding: 0 10px; color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="center">
      <h1>Owner Login</h1>

      {% if messages %}
          {% for message in messages %}
              {% if message.tags == 'error' %}
                  <center><h4 style="color: firebrick;">{{message}}</h4></center>
              {% else %}
                  <center><h4 style="color: dodgerblue;">{{message}}</h4></center>
              {% endif %}
          {% endfor %}
      {% endif %}
        
      <!-- 1. EMAIL/PASSWORD FORM -->
      <form method="POST" action="">
        {% csrf_token %}
        <div class="txt_field">
          <input type="email" required name="email">
          <span></span>
          <label>Email</label>
        </div>
        <div class="txt_field">
          <input type="password" required name="password">
          <span></span>
          <label>Password</label>
        </div>
        <input type="submit" value="Login">
      </form>

      <div class="divider"><span>OR</span></div>
        
      <div class="login-container">
        <!-- 2. GOOGLE LOGIN -->
        <a href="{% provider_login_url 'google' %}" class="btn-google">
            Sign in with Google (Owners)
        </a>
      </div>

    </div>
  </body>
</html>
