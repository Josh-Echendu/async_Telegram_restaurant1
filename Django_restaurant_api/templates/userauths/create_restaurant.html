{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Setup Your Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Welcome to VibeFlow!</h1>
            <p class="text-sm text-gray-500 mt-2">Let's set up your restaurant to get started.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Restaurant Name</label>
                    <input type="text" name="restaurant_name" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                           placeholder="e.g. HungryBelly">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Business Type</label>
                    <select name="business_type" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="restaurant">Restaurant</option>
                        <option value="vendor">Vendor</option>
                        <option value="hotel">Hotel</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition-all mt-6">
                    Create Restaurant & Go to Dashboard
                </button>
            </div>
        </form>
    </div>

</body>
</html>
